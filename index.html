<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #12121a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Gold Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px #d4af37;
            animation: floatUp 12s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Glass Card */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #d4af37; /* Elegant Gold */
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 1.8rem;
            color: #f8f8f8;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 30px auto;
        }

        .message {
            font-size: 1rem;
            line-height: 1.8;
            color: #cccccc;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .btn {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 35px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: #d4af37;
            color: #12121a;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .hidden-msg {
            margin-top: 30px;
            font-style: italic;
            color: #d4af37;
            opacity: 0;
            transition: opacity 1s ease;
            font-size: 1.1rem;
        }

        .hidden-msg.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.4rem; }
            .card { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <!-- Floating Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Main Content -->
    <div class="card">
        <h1>Happy Birthday</h1>
        <h2>Mouha</h2> <!-- CHANGE THIS TO YOUR FRIEND'S NAME -->
        <div class="divider"></div>
        <p class="message">
            Wishing you a day filled with elegance, joy, and everything wonderful. 
            Here's to another year of being absolutely Happy.

            Amulli amegaz ayahawach negh, le3quva ar wayen yettmeni wulik.
        </p> <!-- CHANGE THIS MESSAGE IF YOU WANT -->
        
        <button class="btn" id="celebrateBtn">Cheers</button>
        
        <p class="hidden-msg" id="hiddenMsg">
            "BANKAI: amouliii ameggaaaaaaaz."
        </p> <!-- HIDDEN MESSAGE THAT APPEARS WHEN CLICKED -->
    </div>

    <script>
        // Generate floating gold particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 12 + 's';
            particle.style.animationDuration = (Math.random() * 8 + 8) + 's';
            particlesContainer.appendChild(particle);
        }

        // Button interaction
        const btn = document.getElementById('celebrateBtn');
        const hiddenMsg = document.getElementById('hiddenMsg');
        
        btn.addEventListener('click', () => {
            hiddenMsg.classList.add('show');
            btn.textContent = '🥂';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
